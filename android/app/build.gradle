plugins {
    id "com.android.application"
}

// 정비핵 안드로이드 앱 = jungbihack.com을 크롬으로 주소창 없이 띄우는 TWA (Trusted Web Activity)
// 서명: 환경변수 ANDROID_KEYSTORE(파일 경로) / ANDROID_KEYSTORE_PASSWORD (.github/workflows/android.yml이 넣어 줌)
def ks = System.getenv("ANDROID_KEYSTORE")
def ksPass = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def vc = (System.getenv("VERSION_CODE") ?: "1") as int

android {
    namespace "com.jungbihack.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.jungbihack.app"
        minSdk 24
        targetSdk 36
        // Play에 올릴 때마다 커져야 함 (CI는 실행 번호를 씀)
        versionCode vc
        versionName "1.0." + vc
    }

    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword ksPass
                keyAlias "upload"
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            if (ks) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.8.0"
}
