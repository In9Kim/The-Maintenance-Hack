# 정비핵 주간 보고서: 매주 월요일 아침 지난주(월~일) 숫자를 GitHub 이슈로 올린다 → GitHub 앱 알림으로 폰에서 확인
#
# 필요한 시크릿 (저장소 Settings → Secrets and variables → Actions). 없는 항목은 보고서에 "연결 안 됨"으로 표시
#   CF_API_TOKEN        Cloudflare API 토큰 (권한: Account Analytics Read)
#   COUPANG_ACCESS_KEY  쿠팡 파트너스 API 키
#   COUPANG_SECRET_KEY
#   GSC_SA_KEY          구글 서치콘솔 읽기용 서비스 계정 JSON 전체 (서치콘솔에 이 계정을 '제한된 사용자'로 추가)
name: Weekly report

on:
  schedule:
    # 매주 월요일 08:13 (한국시간) = 일요일 23:13 UTC
    - cron: "13 23 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 액션은 바뀔 수 있는 태그 대신 커밋 SHA로 고정 (뒤 주석이 버전)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Build report
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
        run: node scripts/weekly-report.mjs > report.md

      - name: Open issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="$(head -n 1 report.md | sed 's/^## //')"
          gh label create weekly-report --color 0B7A53 --description "주간 보고서" 2>/dev/null || true
          gh issue create --title "$title" --body-file report.md --label weekly-report --assignee "${{ github.repository_owner }}"
