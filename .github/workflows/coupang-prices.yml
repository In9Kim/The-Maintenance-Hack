# 쿠팡 추천 상품 가격 하루 1번 갱신 (scripts/refresh-coupang-prices.mjs) → 바뀌면 커밋 → Cloudflare가 자동 배포
# 상품을 새로 고르지 않고, 이미 고른 상품(data/coupang-picks.json)의 가격·확인 날짜만 바꾼다.
# 필요한 시크릿: COUPANG_ACCESS_KEY, COUPANG_SECRET_KEY (주간 보고서와 같은 키)
name: Update Coupang prices

on:
  schedule:
    # 매일 07:41 (한국시간) = 22:41 UTC
    - cron: "41 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Refresh prices
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: node scripts/refresh-coupang-prices.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/coupang-picks.json; then
            echo "가격 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coupang-picks.json
          git commit -m "chore(data): 쿠팡 가격 갱신 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase -q
          git push
