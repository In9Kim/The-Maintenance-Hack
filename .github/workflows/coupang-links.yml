# 쿠팡 파트너스 링크 매주 점검 (scripts/check-coupang-links.mjs)
# 문제가 있으면 실행이 실패하고 GitHub가 저장소 주인에게 메일을 보낸다. 시크릿 필요 없음, 읽기 전용.
name: Check Coupang links

on:
  schedule:
    # 매주 월요일 07:23 (한국시간) = 일요일 22:23 UTC
    - cron: "23 22 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node scripts/check-coupang-links.mjs
